name: Documenter

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
  workflow_dispatch:

jobs:
  Documenter:
    name: documentation
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: r-lib/actions/setup-r@v2
      - run: |
        R_PATH=$(Rscript -e 'cat(R.home())')
        echo "R_HOME=$R_PATH" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$R_PATH/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
        R_HOME="$R_PATH" julia --project=docs/ -e 'using Pkg; Pkg.build("RCall")'
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
